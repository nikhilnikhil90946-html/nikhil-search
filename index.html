
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikhil Search 2.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #202124;
  text-align: center;
  transition: .3s;
}

body.dark {
  background: #171717;
  color: white;
}

.top {
  display: flex;
  justify-content: flex-end;
  padding: 20px;
}

.darkbtn {
  border-radius: 25px;
  padding: 10px 15px;
  border: 1px solid #aaa;
  background: transparent;
  color: inherit;
}

.container {
  margin: 90px auto 0;
  padding: 15px;
  max-width: 650px;
}

.logo {
  font-size: 52px;
  font-weight: bold;
  margin-bottom: 35px;
}

.logo span:nth-child(1) {color:#4285f4}
.logo span:nth-child(2) {color:#ea4335}
.logo span:nth-child(3) {color:#fbbc05}
.logo span:nth-child(4) {color:#4285f4}
.logo span:nth-child(5) {color:#34a853}
.logo span:nth-child(6) {color:#ea4335}

.searchbox {
  display: flex;
  align-items: center;
  border: 1px solid #ddd;
  border-radius: 35px;
  padding: 5px 15px;
  box-shadow: 0 2px 8px #00000012;
}

.dark .searchbox {
  border-color: #555;
}

.searchbox input {
  flex: 1;
  min-width: 0;
  padding: 13px 5px;
  border: none;
  outline: none;
  font-size: 16px;
  background: transparent;
  color: inherit;
}

.searchbox button {
  border: none;
  background: transparent;
  font-size: 20px;
  cursor: pointer;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 25px;
}

.buttons button {
  padding: 12px 17px;
  border: none;
  border-radius: 25px;
  background: #f1f3f4;
  cursor: pointer;
}

.dark .buttons button {
  background: #333;
  color: white;
}

.buttons button:hover {
  background: #dce8fa;
}

.suggestions {
  margin-top: 35px;
}

.suggestions button {
  display: inline-block;
  margin: 5px;
  padding: 10px 14px;
  border: 1px solid #ddd;
  border-radius: 20px;
  background: transparent;
  color: inherit;
}

.footer {
  margin-top: 100px;
  color: gray;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="top">
<button class="darkbtn" onclick="darkMode()">
🌙 Dark Mode
</button>
</div>

<div class="container">

<div class="logo">
<span>N</span><span>i</span><span>k</span><span>h</span><span>i</span><span>l</span>
</div>

<div class="searchbox">

<input id="query"
type="text"
placeholder="Search anything..."
onkeydown="if(event.key==='Enter') search('web')">

<button onclick="voiceSearch()">🎤</button>

<button onclick="search('web')">🔍</button>

</div>

<div class="buttons">
<button onclick="search('web')">🌐 Web</button>
<button onclick="search('images')">🖼️ Images</button>
<button onclick="search('videos')">🎬 Videos</button>
<button onclick="search('news')">📰 News</button>
<button onclick="search('maps')">📍 Maps</button>
</div>

<div class="suggestions">
<h3>🔥 Trending Searches</h3>

<button onclick="quick('Technology')">Technology</button>
<button onclick="quick('Cricket')">Cricket</button>
<button onclick="quick('Coding')">Coding</button>
<button onclick="quick('Artificial Intelligence')">AI</button>
<button onclick="quick('Space')">Space</button>
</div>

</div>

<div class="footer">
<h3>Nikhil Search</h3>
<p>Explore the World 🌍</p>
<p>© 2026 Nikhil Search</p>
</div>

<script>

function search(type) {

let q = document.getElementById("query").value.trim();

if (!q) {
alert("Please enter something to search!");
return;
}

let urls = {
web: "https://www.google.com/search?q=",
images: "https://www.google.com/search?tbm=isch&q=",
videos: "https://www.google.com/search?tbm=vid&q=",
news: "https://www.google.com/search?tbm=nws&q=",
maps: "https://www.google.com/maps/search/"
};

window.location.href = urls[type] + encodeURIComponent(q);

}

function quick(value) {
document.getElementById("query").value = value;
search("web");
}

function darkMode() {
document.body.classList.toggle("dark");
}

function voiceSearch() {

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if (!SpeechRecognition) {
alert("Voice search is not supported in this browser.");
return;
}

const recognition = new SpeechRecognition();

recognition.lang = "hi-IN";
recognition.start();

recognition.onresult = function(event) {
document.getElementById("query").value =
event.results[0][0].transcript;
};

}

</script>

</body>
  </html>
